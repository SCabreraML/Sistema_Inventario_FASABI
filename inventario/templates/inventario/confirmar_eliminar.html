{% extends 'base.html' %}

{% block title %}Confirmar Eliminación - Sistema de Inventario{% endblock %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-8 offset-md-2">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h3 class="mb-0 text-white h5">Confirmar Eliminación</h3>
            </div>
            <div class="card-body">
                <div class="alert alert-warning">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    ¿Estás seguro que deseas eliminar este {{ tipo }}?
                    <strong>{{ objeto }}</strong>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-end mt-4">
                        <a href="{{ request.META.HTTP_REFERER }}" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
