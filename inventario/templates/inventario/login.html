<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión | Sistema de Inventario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>

        body{
            background:#eef2f7;
            font-family:"Segoe UI",sans-serif;
        }

        /* Barra superior */

        .navbar{
            background:#003B7A;
            height:70px;
        }

        .navbar-brand{
            font-weight:bold;
            font-size:22px;
        }

        /* Login */

        .login-card{

            width:430px;

            border:none;

            border-radius:15px;

            box-shadow:0 8px 25px rgba(0,0,0,.12);

            background:white;

        }

        .login-header{

            background:#003B7A;

            color:white;

            padding:25px;

            border-radius:15px 15px 0 0;

            text-align:center;

        }

        .login-header i{

            font-size:55px;

            margin-bottom:10px;

        }

        .btn-primary{

            background:#003B7A;

            border:none;

        }

        .btn-primary:hover{

            background:#002f63;

        }

        .form-control{

            height:48px;

        }

        .footer{

            text-align:center;

            margin-top:25px;

            color:#777;

            font-size:14px;

        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow">

    <div class="container">

        <a class="navbar-brand" href="/">
            <i class="bi bi-building"></i>
            Sistema de Inventario
        </a>

    </div>

</nav>

<div class="container">

    <div class="d-flex justify-content-center align-items-center"
         style="min-height:85vh;">

        <div class="login-card">

            <div class="login-header">

                <i class="bi bi-person-circle"></i>

                <h3>Iniciar Sesión</h3>

                <p class="mb-0">
                    Acceda al Sistema de Inventario
                </p>

            </div>

            <div class="card-body p-4">

                {% if error %}

                <div class="alert alert-danger">

                    {{ error }}

                </div>

                {% endif %}

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label">
                            Usuario
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-person"></i>

                            </span>

                            <input type="text"
                                   class="form-control"
                                   name="username"
                                   required
                                   autofocus>

                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Contraseña
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-lock"></i>

                            </span>

                            <input type="password"
                                   class="form-control"
                                   name="password"
                                   required>

                        </div>

                    </div>

                    <button class="btn btn-primary w-100">

                        <i class="bi bi-box-arrow-in-right"></i>

                        Ingresar

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<div class="footer">

    © 2026 Sistema de Compras e Inventario

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
