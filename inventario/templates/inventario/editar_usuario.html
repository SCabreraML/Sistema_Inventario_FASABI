{% extends 'base.html' %}

{% block title %}Editar Usuario - Sistema de Inventario{% endblock %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header bg-white">
                <h4 class="mb-0">Editar Usuario</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Nombre de usuario</label>
                        <input type="text" name="username" class="form-control" value="{{ usuario_editar.username }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ usuario_editar.email }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <select name="rol" class="form-select" required>
                            <option value="ADMIN" {% if usuario_editar.rol == 'ADMIN' %}selected{% endif %}>Administrador</option>
                            <option value="CAJERO" {% if usuario_editar.rol == 'CAJERO' %}selected{% endif %}>Cajero</option>
                            <option value="BODEGA" {% if usuario_editar.rol == 'BODEGA' %}selected{% endif %}>Bodeguero</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-end mt-4">
                        <a href="{% url 'usuario_list' %}" class="btn btn-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
